# LiteLLM proxy for StudyMate. The app sends requests here; LiteLLM forwards them to Gemini.
# Key pool: copy the entries below with GEMINI_KEY_2, GEMINI_KEY_3... (one per Google project).
# Entries sharing a model_name are load-balanced, and a rate-limited key is skipped.
model_list:
  # Flash-Lite first: higher free limits. It doesn't think by default.
  - model_name: chat
    litellm_params: { model: gemini/gemini-3.5-flash-lite, api_key: os.environ/GEMINI_KEY_1 }
  # Used when Flash-Lite's quota runs out (gemini-3.5-flash free tier: 20 requests/day).
  - model_name: chat-backup
    litellm_params: { model: gemini/gemini-3.5-flash, api_key: os.environ/GEMINI_KEY_1, reasoning_effort: disable }
  # Second key (another Google project): its own quota, load-balanced with key 1.
  - model_name: chat
    litellm_params: { model: gemini/gemini-3.5-flash-lite, api_key: os.environ/GEMINI_KEY_2 }
  - model_name: chat-backup
    litellm_params: { model: gemini/gemini-3.5-flash, api_key: os.environ/GEMINI_KEY_2, reasoning_effort: disable }
  - model_name: embed
    litellm_params: { model: gemini/gemini-embedding-001, api_key: os.environ/GEMINI_KEY_2 }
  - model_name: embed
    litellm_params: { model: gemini/gemini-embedding-001, api_key: os.environ/GEMINI_KEY_1 }

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  fallbacks: [{ chat: [chat-backup] }]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
