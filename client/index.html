<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyMate AI</title>
  <style>
    :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#0f766e; --bad:#b91c1c; --good:#15803d; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0c0a09; --fg:#f5f5f4; --muted:#a8a29e; --card:#1c1917; --line:#292524; --accent:#2dd4bf; --bad:#f87171; --good:#4ade80; } }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    nav { display:flex; gap:16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    nav a { color:var(--fg); text-decoration:none; } nav a.active { color:var(--accent); font-weight:600; }
    nav .right { margin-left:auto; display:flex; gap:12px; align-items:center; }
    main { max-width:800px; margin:0 auto; padding:24px 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; }
    input, select, textarea, button { font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
    textarea { width:100%; min-height:120px; }
    button { background:var(--accent); color:var(--bg); border:none; cursor:pointer; font-weight:600; }
    button.ghost { background:none; color:var(--fg); border:1px solid var(--line); }
    button:disabled { opacity:.5; cursor:wait; }
    form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .muted { color:var(--muted); } .err { color:var(--bad); } .good { color:var(--good); } .bad { color:var(--bad); }
    details { margin-top:6px; font-size:14px; } summary { cursor:pointer; color:var(--accent); }
    .msg { white-space:pre-wrap; }
    label.opt { display:block; padding:6px 8px; border-radius:6px; cursor:pointer; } label.opt:hover { background:var(--line); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
