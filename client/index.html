<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyMate AI</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    /* light-dark(light, dark): follows the system unless the toggle sets data-theme on <html>. */
    :root {
      color-scheme: light dark;
      --paper: light-dark(#f6f4ef, #121210); --surface: light-dark(#fffefb, #1a1a17);
      --ink: light-dark(#1a1a17, #ecebe6); --ink-2: light-dark(#57564f, #b3b1a8); --ink-3: light-dark(#8e8c83, #7b7970);
      --line: light-dark(#e4e1d8, #2a2925); --line-2: light-dark(#d3cfc3, #3a3833);
      --accent: light-dark(#1f5f4f, #7fc4ad); --accent-ink: light-dark(#f6f4ef, #10201b); --accent-soft: light-dark(#e3eee9, #1d2b26);
      --warn: light-dark(#a3580b, #e8a65c); --warn-soft: light-dark(#f8ecdc, #2d2216); --bad: light-dark(#a83226, #f08a7c); --good: light-dark(#2b6e3f, #8fd1a1);
      --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
      --serif: 'Instrument Serif', Georgia, serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
      --r: 10px;
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body { margin: 0; font: 15px/1.55 var(--sans); background: var(--paper); color: var(--ink); font-feature-settings: 'ss01', 'cv11'; }
    h1, h2, h3 { font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
    h2 { font-size: 28px; margin: 0 0 20px; }
    h2 em, .serif { font-family: var(--serif); font-weight: 400; font-style: italic; letter-spacing: 0; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

    nav { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; align-items: center; padding: 10px 20px;
      background: color-mix(in srgb, var(--paper) 82%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    nav .brand { font-family: var(--serif); font-size: 21px; margin-right: 16px; }
    nav a.tab { color: var(--ink-2); text-decoration: none; padding: 6px 10px; border-radius: 7px; transition: color .2s, background .2s; }
    nav a.tab:hover { color: var(--ink); background: var(--line); }
    nav a.tab.active { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
    nav .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }

    main { max-width: 860px; margin: 0 auto; padding: 36px 20px 80px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin-bottom: 12px; }
    input, select, textarea, button { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
      transition: border-color .15s, box-shadow .15s, background .15s, transform .15s var(--ease); }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
    textarea { width: 100%; min-height: 120px; }
    button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--ink); color: var(--paper); border: 1px solid var(--ink);
      font-weight: 500; cursor: pointer; text-decoration: none; padding: 9px 14px; border-radius: 8px; transition: transform .15s var(--ease), opacity .15s, background .15s; }
    button:active, .btn:active { transform: scale(.97); }
    button.ghost, .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
    button.ghost:hover, .btn.ghost:hover { background: var(--line); }
    .btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    button:disabled { opacity: .5; cursor: progress; }
    form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    a { color: var(--accent); }
    .muted { color: var(--ink-3); } .err { color: var(--bad); } .good { color: var(--good); } .bad { color: var(--bad); }
    details { margin-top: 6px; font-size: 14px; } summary { cursor: pointer; color: var(--accent); }
    .msg { white-space: pre-wrap; }
    label.opt { display: block; padding: 7px 9px; border-radius: 7px; cursor: pointer; } label.opt:hover { background: var(--line); }
    table { width: 100%; border-collapse: collapse; }
    th { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); text-align: left; padding: 0 0 10px; }
    td { padding: 10px 0; border-top: 1px solid var(--line); }

    /* Study-desk motifs: ruled paper, highlighter, subject tints (--h = hue per subject). */
    :root { --hl: light-dark(#f3df72, #6b5a1c); --rule: light-dark(#dfe6ee, #24272b); --margin: light-dark(#e9b4ad, #4a2b28); }
    .ruled { background: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px), var(--surface); }
    mark { background: linear-gradient(100deg, transparent 2%, var(--hl) 4% 96%, transparent 98%) 0 60% / 100% 70% no-repeat; color: inherit; padding: 0 2px; }
    .tint { --c: light-dark(oklch(52% .1 var(--h, 150)), oklch(76% .09 var(--h, 150))); }
    .theme-toggle { padding: 7px; background: transparent; color: var(--ink-2); border-color: var(--line-2); }
    .theme-toggle:hover { color: var(--ink); background: var(--line); }
    .theme-toggle svg { display: block; transition: rotate .4s var(--ease); }
    .theme-toggle:active svg { rotate: 30deg; }
    .field { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
    .field input, .field select { width: 100%; }
    .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--line); }
    .seg button { background: transparent; color: var(--ink-2); border: 0; padding: 6px 14px; border-radius: 7px; font-size: 14px; }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line-2); }
    .chip { background: transparent; color: var(--ink-2); border: 1px solid var(--line-2); padding: 4px 11px; border-radius: 99px; font-size: 13px; font-weight: 500; gap: 7px; }
    .chip:hover { background: var(--line); color: var(--ink); }
    .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

    /* Motion: entry via @starting-style, page swaps via the View Transitions API. */
    .rise { opacity: 1; transform: none; transition: opacity .5s var(--ease), transform .5s var(--ease); }
    @starting-style { .rise { opacity: 0; transform: translateY(8px); } }
    .rise:nth-child(2) { transition-delay: 60ms; } .rise:nth-child(3) { transition-delay: 120ms; } .rise:nth-child(4) { transition-delay: 180ms; }
    ::view-transition-old(root) { animation: .18s var(--ease) both vt-out; }
    ::view-transition-new(root) { animation: .32s var(--ease) both vt-in; }
    @keyframes vt-out { to { opacity: 0; } }
    @keyframes vt-in { from { opacity: 0; transform: translateY(6px); } }
    /* Brand: icon + "StudyMate AI" wordmark, sized by the parent's font-size. */
    .logo { display: inline-flex; align-items: center; gap: .4em; font: 600 .85em/1 var(--sans); letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
    .logo img { width: 1.35em; height: 1.35em; }
    .logo b { font-weight: inherit; color: light-dark(#4F46E5, #8f8aff); }

    /* Boot loader: the icon assembles (tile → book opens → stem grows → nodes pop), then nodes pulse until the app is ready. */
    #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--paper); transition: opacity .35s var(--ease), visibility .35s; }
    #boot.done { opacity: 0; visibility: hidden; }
    #boot svg { width: 88px; height: 88px; overflow: visible; }
    #boot .tile { transform-origin: center; animation: b-tile .5s var(--ease) both; }
    #boot .pl, #boot .pr { transform-origin: 32px 44px; animation: b-open .55s .35s var(--ease) both; }
    #boot .ln { stroke-dasharray: 1; animation: b-draw .4s var(--ease) both; }
    #boot .stem { animation-delay: .75s; } #boot .br { animation-delay: 1.1s; }
    #boot .nd { transform-box: fill-box; transform-origin: center; animation: b-pop .35s var(--ease) both, b-pulse 1.4s 1.8s ease-in-out infinite; }
    #boot .n0 { animation-delay: 1s, 1.8s; } #boot .n1 { animation-delay: 1.4s, 2s; } #boot .n2 { animation-delay: 1.5s, 2.2s; }
    @keyframes b-tile { from { opacity: 0; transform: scale(.6) rotate(-8deg); } }
    @keyframes b-open { from { opacity: 0; transform: scaleX(0); } }
    @keyframes b-draw { from { stroke-dashoffset: 1; } }
    @keyframes b-pop { from { transform: scale(0); } 70% { transform: scale(1.3); } }
    @keyframes b-pulse { 50% { transform: scale(1.25); } }
    @media (prefers-reduced-motion: reduce) {
      *, ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; transition: none !important; }
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
</head>
<body>
  <script>try { const t = localStorage.theme; if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <div id="boot" role="status" aria-label="Loading StudyMate AI">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect class="tile" width="64" height="64" rx="15" fill="#4F46E5"/>
      <g stroke="#2DD4BF" stroke-width="2.6" stroke-linecap="round" fill="none">
        <path class="ln stem" pathLength="1" d="M32 37V14"/>
        <path class="ln br" pathLength="1" d="M32 14 18 23"/><path class="ln br" pathLength="1" d="M32 14 46 23"/>
      </g>
      <g fill="#2DD4BF"><circle class="nd n0" cx="32" cy="14" r="4.6"/><circle class="nd n1" cx="18" cy="23" r="3.6"/><circle class="nd n2" cx="46" cy="23" r="3.6"/></g>
      <path class="pl" fill="#fff" d="M31 37C25 33.5 18.5 33.5 12 35.5V52C18.5 50 25 50.5 31 54Z"/>
      <path class="pr" fill="#fff" d="M33 37C39 33.5 45.5 33.5 52 35.5V52C45.5 50 39 50.5 33 54Z"/>
    </svg>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
