<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudyMate AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f6f4ef; --surface: #fffefb; --ink: #1a1a17; --ink-2: #57564f; --ink-3: #8e8c83;
      --line: #e4e1d8; --line-2: #d3cfc3;
      --accent: #1f5f4f; --accent-ink: #f6f4ef; --accent-soft: #e3eee9;
      --warn: #a3580b; --warn-soft: #f8ecdc; --bad: #a83226; --good: #2b6e3f;
      --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
      --serif: 'Instrument Serif', Georgia, serif;
      --ease: cubic-bezier(.2, .7, .2, 1);
      --r: 10px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121210; --surface: #1a1a17; --ink: #ecebe6; --ink-2: #b3b1a8; --ink-3: #7b7970;
        --line: #2a2925; --line-2: #3a3833;
        --accent: #7fc4ad; --accent-ink: #10201b; --accent-soft: #1d2b26;
        --warn: #e8a65c; --warn-soft: #2d2216; --bad: #f08a7c; --good: #8fd1a1;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body { margin: 0; font: 15px/1.55 var(--sans); background: var(--paper); color: var(--ink); font-feature-settings: 'ss01', 'cv11'; }
    h1, h2, h3 { font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
    h2 { font-size: 28px; margin: 0 0 20px; }
    h2 em, .serif { font-family: var(--serif); font-weight: 400; font-style: italic; letter-spacing: 0; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
    .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }

    nav { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; align-items: center; padding: 10px 20px;
      background: color-mix(in srgb, var(--paper) 82%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    nav .brand { font-family: var(--serif); font-size: 21px; margin-right: 16px; }
    nav a.tab { color: var(--ink-2); text-decoration: none; padding: 6px 10px; border-radius: 7px; transition: color .2s, background .2s; }
    nav a.tab:hover { color: var(--ink); background: var(--line); }
    nav a.tab.active { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
    nav .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }

    main { max-width: 860px; margin: 0 auto; padding: 36px 20px 80px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin-bottom: 12px; }
    input, select, textarea, button { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
      transition: border-color .15s, box-shadow .15s, background .15s, transform .15s var(--ease); }
    input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
    textarea { width: 100%; min-height: 120px; }
    button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--ink); color: var(--paper); border: 1px solid var(--ink);
      font-weight: 500; cursor: pointer; text-decoration: none; padding: 9px 14px; border-radius: 8px; transition: transform .15s var(--ease), opacity .15s, background .15s; }
    button:active, .btn:active { transform: scale(.97); }
    button.ghost, .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
    button.ghost:hover, .btn.ghost:hover { background: var(--line); }
    .btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    button:disabled { opacity: .5; cursor: progress; }
    form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    a { color: var(--accent); }
    .muted { color: var(--ink-3); } .err { color: var(--bad); } .good { color: var(--good); } .bad { color: var(--bad); }
    details { margin-top: 6px; font-size: 14px; } summary { cursor: pointer; color: var(--accent); }
    .msg { white-space: pre-wrap; }
    label.opt { display: block; padding: 7px 9px; border-radius: 7px; cursor: pointer; } label.opt:hover { background: var(--line); }
    table { width: 100%; border-collapse: collapse; }
    th { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); text-align: left; padding: 0 0 10px; }
    td { padding: 10px 0; border-top: 1px solid var(--line); }

    /* Motion: entry via @starting-style, page swaps via the View Transitions API. */
    .rise { opacity: 1; transform: none; transition: opacity .5s var(--ease), transform .5s var(--ease); }
    @starting-style { .rise { opacity: 0; transform: translateY(8px); } }
    .rise:nth-child(2) { transition-delay: 60ms; } .rise:nth-child(3) { transition-delay: 120ms; } .rise:nth-child(4) { transition-delay: 180ms; }
    ::view-transition-old(root) { animation: .18s var(--ease) both vt-out; }
    ::view-transition-new(root) { animation: .32s var(--ease) both vt-in; }
    @keyframes vt-out { to { opacity: 0; } }
    @keyframes vt-in { from { opacity: 0; transform: translateY(6px); } }
    @media (prefers-reduced-motion: reduce) {
      *, ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
